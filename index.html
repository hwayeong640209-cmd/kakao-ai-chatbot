```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    전남운전면허시험장 업무 안내 챗봇
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      background: #ffffff;
    }

    /* -------------------------------
       헤더
    -------------------------------- */

    .header {
      padding: 20px;
      background: #14532d;
      color: white;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    /* -------------------------------
       채팅 영역
    -------------------------------- */

    .chat-container {
      flex: 1;

      padding: 20px;

      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;

      padding: 12px 15px;

      border-radius: 16px;

      font-size: 15px;
      line-height: 1.6;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .user .bubble {
      background: #14532d;
      color: white;

      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: #f1f3f5;
      color: #222;

      border-bottom-left-radius: 4px;
    }

    /* -------------------------------
       로딩
    -------------------------------- */

    .loading {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #666;
      font-size: 14px;
    }

    .loading span {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: #777;

      animation: blink 1.2s infinite;
    }

    .loading span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: 0.3;
      }

      40% {
        opacity: 1;
      }
    }

    /* -------------------------------
       입력 영역
    -------------------------------- */

    .input-area {
      border-top: 1px solid #ddd;

      padding: 12px;

      display: flex;
      gap: 8px;

      background: white;

      position: sticky;
      bottom: 0;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      padding: 12px 14px;

      border: 1px solid #ccc;
      border-radius: 12px;

      font-size: 15px;

      outline: none;
    }

    #messageInput:focus {
      border-color: #14532d;
    }

    #sendButton {
      border: none;

      padding: 0 20px;

      border-radius: 12px;

      background: #14532d;
      color: white;

      font-size: 15px;

      cursor: pointer;
    }

    #sendButton:hover {
      background: #166534;
    }

    #sendButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* -------------------------------
       모바일
    -------------------------------- */

    @media (max-width: 600px) {
      .header {
        padding: 16px;
      }

      .header h1 {
        font-size: 18px;
      }

      .chat-container {
        padding: 14px;
      }

      .bubble {
        max-width: 88%;
        font-size: 14px;
      }

      .input-area {
        padding: 8px;
      }

      #sendButton {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ==========================
         헤더
    =========================== -->

    <header class="header">
      <h1>
        한국도로교통공단 전남운전면허시험장
      </h1>

      <p>
        업무 안내 챗봇
      </p>
    </header>


    <!-- ==========================
         채팅창
    =========================== -->

    <main
      id="chatContainer"
      class="chat-container"
    >

      <div class="message bot">
        <div class="bubble">
          안녕하세요! 한국도로교통공단 전남운전면허시험장 업무 안내 챗봇입니다.
          운전면허와 관련하여 궁금하신 업무를 말씀해 주세요.
        </div>
      </div>

    </main>


    <!-- ==========================
         입력창
    =========================== -->

    <form
      id="chatForm"
      class="input-area"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="궁금한 업무를 입력해주세요."
        autocomplete="off"
      />

      <button
        id="sendButton"
        type="submit"
      >
        보내기
      </button>

    </form>

  </div>


  <script>
    // ==================================================
    // DOM
    // ==================================================

    const chatContainer =
      document.getElementById("chatContainer");

    const chatForm =
      document.getElementById("chatForm");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");


    // ==================================================
    // 메시지 추가
    // ==================================================

    function addMessage(type, text) {
      const message =
        document.createElement("div");

      message.className =
        `message ${type}`;

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      // innerHTML이 아니라 textContent를 사용하여
      // 서버 응답이 HTML로 실행되지 않도록 한다.
      bubble.textContent = text;

      message.appendChild(bubble);

      chatContainer.appendChild(message);

      scrollToBottom();
    }


    // ==================================================
    // 로딩 표시
    // ==================================================

    function showLoading() {
      const message =
        document.createElement("div");

      message.className =
        "message bot";

      message.id =
        "loadingMessage";

      message.innerHTML = `
        <div class="bubble">
          <div class="loading">
            <span></span>
            <span></span>
            <span></span>
            답변을 작성하고 있습니다.
          </div>
        </div>
      `;

      chatContainer.appendChild(message);

      scrollToBottom();
    }


    function hideLoading() {
      const loading =
        document.getElementById(
          "loadingMessage"
        );

      if (loading) {
        loading.remove();
      }
    }


    // ==================================================
    // 스크롤
    // ==================================================

    function scrollToBottom() {
      chatContainer.scrollTop =
        chatContainer.scrollHeight;
    }


    // ==================================================
    // 서버 응답을 안전하게 읽기
    // ==================================================

    async function readResponse(response) {

      // 먼저 텍스트로 받는다.
      // response.json()을 바로 사용하지 않는다.
      const rawText =
        await response.text();

      let data = null;

      // JSON인지 확인
      try {
        data = JSON.parse(rawText);
      } catch (error) {
        // JSON이 아니면 그대로 문자열로 처리
        data = null;
      }


      // -------------------------------
      // 정상 JSON
      // -------------------------------

      if (response.ok && data) {

        if (
          typeof data.answer === "string"
        ) {
          return data.answer;
        }

        if (
          typeof data.message === "string"
        ) {
          return data.message;
        }

        return "서버에서 답변을 받았지만 내용을 확인할 수 없습니다.";
      }


      // -------------------------------
      // JSON 형태의 서버 오류
      // -------------------------------

      if (
        data &&
        typeof data.error === "string"
      ) {
        throw new Error(data.error);
      }


      // -------------------------------
      // JSON이 아닌 서버 오류
      // -------------------------------

      if (rawText) {

        // Vercel/서버에서 HTML 또는 일반 텍스트
        // 오류가 내려오는 경우도 처리
        const cleaned =
          rawText
            .replace(/<[^>]*>/g, " ")
            .replace(/\s+/g, " ")
            .trim();

        if (cleaned) {
          throw new Error(cleaned);
        }
      }


      throw new Error(
        `서버 오류가 발생했습니다. (${response.status})`
      );
    }


    // ==================================================
    // 질문 보내기
    // ==================================================

    async function sendMessage() {

      const message =
        messageInput.value.trim();

      if (!message) {
        return;
      }


      // 사용자 질문 표시
      addMessage(
        "user",
        message
      );


      // 입력창 비우기
      messageInput.value = "";


      // 중복 전송 방지
      sendButton.disabled = true;
      messageInput.disabled = true;


      // 로딩 표시
      showLoading();


      try {

        // --------------------------------------------
        // API 호출
        // --------------------------------------------

        const response =
          await fetch("/api/chat", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        // --------------------------------------------
        // 안전하게 응답 읽기
        // --------------------------------------------

        const answer =
          await readResponse(response);


        // --------------------------------------------
        // 답변 표시
        // --------------------------------------------

        addMessage(
          "bot",
          answer
        );


      } catch (error) {

        console.error(
          "챗봇 요청 오류:",
          error
        );


        // 사용자에게 너무 긴 서버 오류를
        // 그대로 노출하지 않도록 처리
        let errorMessage =
          error?.message ||
          "알 수 없는 오류가 발생했습니다.";


        // JSON 파싱 오류 같은 내부 오류는
        // 사용자에게 보여주지 않는다.
        if (
          errorMessage.includes(
            "Unexpected token"
          )
        ) {
          errorMessage =
            "서버에서 정상적인 답변을 받지 못했습니다.";
        }


        addMessage(
          "bot",
          "오류가 발생했습니다.\n" +
          errorMessage
        );

      } finally {

        hideLoading();

        sendButton.disabled = false;
        messageInput.disabled = false;

        messageInput.focus();
      }
    }


    // ==================================================
    // 폼 제출
    // ==================================================

    chatForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        sendMessage();
      }
    );


    // ==================================================
    // Enter 키
    // ==================================================

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          chatForm.requestSubmit();
        }
      }
    );


    // ==================================================
    // 처음 실행할 때 입력창 포커스
    // ==================================================

    messageInput.focus();

  </script>

</body>
</html>
```
