<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>전남운전면허시험장 업무 안내 챗봇</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .header {
      padding: 18px 20px;
      background: #1261c9;
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header-subtitle {
      font-size: 13px;
      opacity: 0.9;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f7f8fa;
    }

    .message-row {
      display: flex;
      margin-bottom: 16px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.bot {
      justify-content: flex-start;
    }

    .message {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #1261c9;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      background: white;
      color: #222;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      background: #fff1f1;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #1261c9;
      box-shadow: 0 0 0 2px rgba(18, 97, 201, 0.1);
    }

    #sendButton {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: #1261c9;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      min-width: 70px;
    }

    #sendButton:hover {
      background: #0d4fa8;
    }

    #sendButton:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .loading span {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .loading span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    @media (max-width: 600px) {
      .header-title {
        font-size: 17px;
      }

      .message {
        max-width: 88%;
      }

      .chat-container {
        padding: 14px;
      }

      .input-area {
        padding: 10px;
      }

      #sendButton {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="header-title">
        한국도로교통공단 전남운전면허시험장
      </div>

      <div class="header-subtitle">
        업무 안내 챗봇
      </div>
    </header>


    <main
      id="chatContainer"
      class="chat-container"
      aria-live="polite"
    >

      <div class="message-row bot">
        <div class="message bot">
안녕하세요! 한국도로교통공단 전남운전면허시험장 업무 안내 챗봇입니다.

운전면허와 관련하여 궁금하신 업무를 말씀해 주시면 안내해 드리겠습니다.
        </div>
      </div>

    </main>


    <form id="chatForm" class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="궁금한 업무를 입력하세요."
        autocomplete="off"
        maxlength="1000"
      />

      <button
        id="sendButton"
        type="submit"
      >
        보내기
      </button>

    </form>

  </div>


  <script>

    const chatContainer = document.getElementById("chatContainer");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    // -----------------------------
    // 메시지를 화면에 추가
    // -----------------------------
    function addMessage(text, type = "bot") {

      const row = document.createElement("div");

      row.className = `message-row ${type}`;


      const message = document.createElement("div");

      message.className = `message ${type}`;

      // innerHTML을 사용하지 않고 textContent를 사용합니다.
      // 사용자가 입력한 HTML/스크립트가 실행되지 않도록 하기 위한 처리입니다.
      message.textContent = text;


      row.appendChild(message);

      chatContainer.appendChild(row);


      chatContainer.scrollTop = chatContainer.scrollHeight;


      return message;
    }


    // -----------------------------
    // 로딩 메시지
    // -----------------------------
    function addLoadingMessage() {

      const row = document.createElement("div");

      row.className = "message-row bot";


      const message = document.createElement("div");

      message.className = "message bot";


      const loading = document.createElement("div");

      loading.className = "loading";

      loading.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
      `;


      message.appendChild(loading);

      row.appendChild(message);

      chatContainer.appendChild(row);


      chatContainer.scrollTop = chatContainer.scrollHeight;


      return row;
    }


    // -----------------------------
    // 질문 보내기
    // -----------------------------
    async function sendMessage(question) {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: question
        })

      });


      /*
       * 중요
       *
       * 서버가 정상적인 JSON을 보내면 JSON으로 처리하고,
       * 서버 오류 때문에 일반 텍스트가 돌아오더라도
       * JSON.parse 오류가 발생하지 않도록 text()로 먼저 받습니다.
       */
      const rawText = await response.text();


      let data = null;


      try {

        data = JSON.parse(rawText);

      } catch (jsonError) {

        console.error("서버 응답이 JSON이 아닙니다:", rawText);

        throw new Error(
          rawText ||
          `서버에서 ${response.status} 오류가 발생했습니다.`
        );

      }


      // HTTP 상태 코드가 200번대가 아니면 오류 처리
      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `서버 오류가 발생했습니다. (${response.status})`
        );

      }


      // 정상적인 응답
      if (data.answer) {

        return data.answer;

      }


      if (data.message) {

        return data.message;

      }


      throw new Error("서버에서 답변을 받지 못했습니다.");

    }


    // -----------------------------
    // 폼 제출
    // -----------------------------
    chatForm.addEventListener("submit", async function(event) {

      event.preventDefault();


      const question = messageInput.value.trim();


      if (!question) {

        return;

      }


      // 사용자 메시지 표시
      addMessage(question, "user");


      // 입력창 초기화
      messageInput.value = "";


      // 버튼 잠금
      sendButton.disabled = true;

      sendButton.textContent = "답변 중";


      // 로딩 표시
      const loadingMessage = addLoadingMessage();


      try {

        const answer = await sendMessage(question);


        // 로딩 제거
        loadingMessage.remove();


        // 답변 표시
        addMessage(answer, "bot");

      }


      catch (error) {

        console.error(error);


        // 로딩 제거
        loadingMessage.remove();


        let errorMessage =
          "오류가 발생했습니다.\n잠시 후 다시 질문해 주세요.";


        if (error && error.message) {

          errorMessage =
            "오류가 발생했습니다.\n\n" +
            error.message;

        }


        addMessage(errorMessage, "error");

      }


      finally {

        sendButton.disabled = false;

        sendButton.textContent = "보내기";

        messageInput.focus();

      }

    });


    // 페이지가 열리면 입력창에 포커스
    messageInput.focus();

  </script>

</body>
</html>
